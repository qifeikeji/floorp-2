# SPDX-License-Identifier: MPL-2.0
#
# Floorp-style: clone Floorp-Runtime (Gecko), inject MOZ_APP_NAME branding,
# FULL compile ONCE, then package N constellation AppImages from brand.config.json.
#
# Expect 3–6+ hours on GitHub-hosted runners. Needs large free disk.

name: Build from Runtime (MOZ_APP_NAME)

on:
  workflow_dispatch:
    inputs:
      runtime_repository:
        description: "Gecko/Runtime repo (owner/name); empty = brand.config.json"
        type: string
        default: ""
      runtime_ref:
        description: "Git ref; empty = brand.config.json or repo default branch"
        type: string
        default: ""

concurrency:
  group: runtime-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    steps:
      - name: Free disk space + add swap
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/graalvm \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h

      - uses: actions/checkout@v5
        with:
          path: floorp-2

      - name: Resolve Runtime source
        id: runtime
        working-directory: floorp-2
        run: |
          set -euo pipefail
          BC=scripts/brand_config.py
          REPO="${{ inputs.runtime_repository }}"
          REF="${{ inputs.runtime_ref }}"
          if [[ -z "$REPO" ]]; then
            REPO="$(python3 "$BC" runtime-repository)"
          fi
          if [[ -z "$REF" ]]; then
            REF="$(python3 "$BC" runtime-ref)"
          fi
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using Runtime $REPO@${REF:-<default>}"

      - name: Checkout Runtime (default branch)
        if: ${{ steps.runtime.outputs.ref == '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          path: runtime
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Runtime (pinned ref)
        if: ${{ steps.runtime.outputs.ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.ref }}
          path: runtime
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl wget python3 python3-pip python3-dev \
            build-essential libasound2-dev libcurl4-openssl-dev libdbus-1-dev \
            libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev nasm nodejs unzip zip \
            squashfs-tools desktop-file-utils \
            libgconf2-dev libncurses-dev xvfb

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Prepare branding (single MOZ_APP_NAME compile)
        run: |
          set -euo pipefail
          chmod +x floorp-2/scripts/*.sh floorp-2/scripts/*.py
          ./floorp-2/scripts/prepare-runtime.sh "$GITHUB_WORKSPACE/runtime"
          ID="$(python3 floorp-2/scripts/brand_config.py compile-id)"
          echo "BRAND_ID=$ID" >> "$GITHUB_ENV"
          echo "MOZCONFIG=$GITHUB_WORKSPACE/runtime/mozconfig.${ID}" >> "$GITHUB_ENV"
          echo "Variants:"; python3 floorp-2/scripts/brand_config.py variant-ids

      - name: Mach bootstrap
        working-directory: runtime
        run: |
          set -euo pipefail
          export MOZCONFIG
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Mach configure
        working-directory: runtime
        run: |
          set -euo pipefail
          export MOZCONFIG
          ./mach configure
          grep -E 'MOZ_APP_NAME|MOZ_APP_DISPLAYNAME|branding|with-app-name' "$MOZCONFIG" || true

      - name: Mach build
        working-directory: runtime
        run: |
          set -euo pipefail
          export MOZCONFIG
          JOBS=2
          if [[ "$(nproc)" -ge 4 ]]; then JOBS=3; fi
          echo "Building with -j${JOBS} (nproc=$(nproc)); free:"; free -h
          ./mach build -j"${JOBS}"

      - name: Mach package
        working-directory: runtime
        run: |
          set -euo pipefail
          export MOZCONFIG
          ./mach package

      - name: Build N AppImages (zodiac variants)
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/runtime/obj-${BRAND_ID}/dist"
          if [[ ! -d "$DIST" ]]; then
            DIST="$(find "$GITHUB_WORKSPACE/runtime" -maxdepth 2 -type d -name dist | head -1)"
          fi
          echo "Using DIST=$DIST"
          ls -la "$DIST" || true
          OUT="$GITHUB_WORKSPACE/floorp-2/dist"
          ./floorp-2/scripts/make-appimage-from-dist.sh "$DIST" "$OUT"
          find "$OUT" -type f | sort
          df -h

      # --- one artifact per constellation (visible under the Action run) ---
      - name: Upload aries
        uses: actions/upload-artifact@v4
        with:
          name: aries
          path: floorp-2/dist/aries/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload taurus
        uses: actions/upload-artifact@v4
        with:
          name: taurus
          path: floorp-2/dist/taurus/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload gemini
        uses: actions/upload-artifact@v4
        with:
          name: gemini
          path: floorp-2/dist/gemini/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload cancer
        uses: actions/upload-artifact@v4
        with:
          name: cancer
          path: floorp-2/dist/cancer/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload leo
        uses: actions/upload-artifact@v4
        with:
          name: leo
          path: floorp-2/dist/leo/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload virgo
        uses: actions/upload-artifact@v4
        with:
          name: virgo
          path: floorp-2/dist/virgo/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload libra
        uses: actions/upload-artifact@v4
        with:
          name: libra
          path: floorp-2/dist/libra/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload scorpio
        uses: actions/upload-artifact@v4
        with:
          name: scorpio
          path: floorp-2/dist/scorpio/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload sagittarius
        uses: actions/upload-artifact@v4
        with:
          name: sagittarius
          path: floorp-2/dist/sagittarius/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload capricorn
        uses: actions/upload-artifact@v4
        with:
          name: capricorn
          path: floorp-2/dist/capricorn/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload aquarius
        uses: actions/upload-artifact@v4
        with:
          name: aquarius
          path: floorp-2/dist/aquarius/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload pisces
        uses: actions/upload-artifact@v4
        with:
          name: pisces
          path: floorp-2/dist/pisces/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
