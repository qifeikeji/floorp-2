#
# Download official Firefox → apply brand.config.json + icons → Type-2 AppImage

name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    paths:
      - "brand.config.json"
      - "icons/**"
      - "scripts/**"
      - ".github/workflows/build_appimage.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget python3 squashfs-tools desktop-file-utils unzip zip

      - name: Build AppImage
        run: |
          chmod +x ./scripts/make-appimage.sh
          ./scripts/make-appimage.sh "$HOME/dist"
          ls -lah "$HOME/dist"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-AppImage
          path: ~/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
