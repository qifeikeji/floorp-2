# SPDX-License-Identifier: MPL-2.0
#
# Build Linux x86_64 Floorp AppImage (Type 2, --appimage-extract compatible)
# and upload it as a workflow artifact.

name: "Build Linux AppImage"

on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        required: false
        default: false
        description: "Use beta/daylight branding"
      runtime_repository:
        type: string
        required: false
        default: "Floorp-Projects/Floorp-Runtime"
        description: "Runtime repo (owner/name). Forks should keep the official upstream unless you have your own runtime."
      runtime_artifact_workflow_run_id:
        type: string
        default: ""
        required: false
        description: "Optional runtime Actions run ID (else use that repo's latest release)"

run-name: Build Linux AppImage${{ inputs.beta && ' (beta)' || '' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      RUNTIME_REPO: ${{ inputs.runtime_repository || 'Floorp-Projects/Floorp-Runtime' }}
    steps:
      - name: Get commit hash from runtime_artifact_workflow_run_id
        if: ${{ inputs.runtime_artifact_workflow_run_id != '' }}
        id: get-commit
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = '${{ inputs.runtime_artifact_workflow_run_id }}';
            const targetRepo = process.env.RUNTIME_REPO;
            const [owner, repo] = targetRepo.split('/');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId
            });
            const commitHash = run.head_sha;
            if (!commitHash || !/^[0-9a-fA-F]{40}$/.test(commitHash)) {
              core.setFailed('Commit hash is missing or not a valid SHA-1: ' + commitHash);
              throw new Error('Commit hash is missing or not a valid SHA-1: ' + commitHash);
            }
            core.setOutput('commit_hash', commitHash);

      - name: Checkout runtime (${{ env.RUNTIME_REPO }})
        uses: actions/checkout@v5
        with:
          repository: ${{ env.RUNTIME_REPO }}
          ref: ${{ steps.get-commit.outputs.commit_hash }}
          submodules: recursive

      - name: Apply upstream patches
        run: |
          PATCH_DIR=".github/patches/upstream"
          if [ -d "$PATCH_DIR" ]; then
            for patch in "$PATCH_DIR"/*.patch; do
              [ -e "$patch" ] || continue
              echo "Applying patch: $(basename "$patch")"
              git apply --verbose "$patch"
            done
          else
            echo "Patch directory not found, skipping."
          fi

      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@v5
        with:
          path: noraneko

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Noraneko
        run: |
          cd "$GITHUB_WORKSPACE/noraneko"
          deno install --allow-scripts

      - name: Bootstrap mach (artifact mode)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget squashfs-tools desktop-file-utils patchelf
          ./mach --no-interactive bootstrap --application-choice browser_artifact_mode

      - name: Write Versions
        run: |
          cd ./noraneko
          deno task feles-build misc writeVersion
          cd ..

      - name: Copy branding files from runtime
        run: |
          if [ -d ".github/assets/branding" ]; then
            cp -r .github/assets/branding/* ./browser/branding/
          else
            echo "Warning: .github/assets/branding not found"
          fi

      - name: Mach configure (Linux-x86_64)
        env:
          IS_BETA: ${{ inputs.beta }}
        run: |
          set -euo pipefail

          MOZCONFIG="./.github/workflows/mozconfigs/linux-x86_64.mozconfig"
          FALLBACK_MOZCONFIG="./.github/workflows/mozconfigs/linux64.mozconfig"
          if [ ! -f "$MOZCONFIG" ]; then
            MOZCONFIG="$FALLBACK_MOZCONFIG"
          fi
          if [ ! -f "$MOZCONFIG" ]; then
            echo "Linux mozconfig not found" >&2
            exit 1
          fi
          cp "$MOZCONFIG" mozconfig

          if [ -d "./noraneko/static/gecko/branding" ]; then
            cp -r ./noraneko/static/gecko/branding/* ./browser/branding/
          fi

          AUTOGEN_DIR="./noraneko/static/gecko/config/autogenerated"
          mkdir -p "$AUTOGEN_DIR"
          echo "$(cat ./noraneko/static/gecko/config/version.txt)@$(cat ./browser/config/version.txt)" > "${AUTOGEN_DIR}/version.txt"
          echo "$(cat ./noraneko/static/gecko/config/version_display.txt)@$(cat ./browser/config/version_display.txt)" > "${AUTOGEN_DIR}/version_display.txt"

          cat >> mozconfig <<'EOF'
          ac_add_options --with-version-file-path=noraneko/static/gecko/config/autogenerated
          ac_add_options --enable-release
          ac_add_options --disable-tests
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=./obj-artifact-build-output
          EOF

          sed -i 's|^[[:space:]]*ac_add_options --disable-updater.*$||g' mozconfig
          sed -i 's|^[[:space:]]*ac_add_options --enable-unverified-updates.*$||g' mozconfig
          sed -i 's|^[[:space:]]*ac_add_options --enable-chrome-format=flat.*$||g' mozconfig
          sed -i 's|^[[:space:]]*ac_add_options --enable-update-channel=.*$||g' mozconfig
          sed -i 's|^[[:space:]]*ac_add_options --with-branding=.*$||g' mozconfig

          UPDATE_UTILS="./toolkit/modules/UpdateUtils.sys.mjs"
          if [ -f "$UPDATE_UTILS" ]; then
            sed -i 's|return encodeURIComponent(replacement);|return name === "NORA_UPDATE_HOST" ? replacement : encodeURIComponent(replacement);|' "$UPDATE_UTILS"
          fi

          CONFVARS="./browser/confvars.sh"

          find_branding_dir() {
            for candidate in "$@"; do
              if [ -d "./browser/branding/${candidate}" ]; then
                echo "${candidate}"
                return 0
              fi
            done
            return 1
          }

          if [ "${IS_BETA}" = "true" ]; then
            UPDATE_CHANNEL="beta"
            if BETA_BRANDING=$(find_branding_dir "floorp-daylight" "noraneko-daylight" "noraneko-alpha"); then
              sed -i "s|MOZ_BRANDING_DIRECTORY=browser/branding/unofficial|MOZ_BRANDING_DIRECTORY=browser/branding/${BETA_BRANDING}|g" "$CONFVARS"
              echo "ac_add_options --enable-update-channel=${UPDATE_CHANNEL}" >> mozconfig
              echo "ac_add_options --with-branding=browser/branding/${BETA_BRANDING}" >> mozconfig
            else
              echo "Unable to locate beta branding directory" >&2
              ls -la ./browser/branding/ >&2
              exit 1
            fi
            BASE_URL="github.com/${{ github.repository }}/releases/download/beta/"
            UPDATE_SUFFIX="Linux_x86_64."
          else
            UPDATE_CHANNEL="release"
            if RELEASE_BRANDING=$(find_branding_dir "floorp-official" "noraneko-official" "noraneko"); then
              sed -i "s|MOZ_BRANDING_DIRECTORY=browser/branding/unofficial|MOZ_BRANDING_DIRECTORY=browser/branding/${RELEASE_BRANDING}|g" "$CONFVARS"
              echo "ac_add_options --enable-update-channel=${UPDATE_CHANNEL}" >> mozconfig
              echo "ac_add_options --with-branding=browser/branding/${RELEASE_BRANDING}" >> mozconfig
            else
              echo "Unable to locate release branding directory" >&2
              ls -la ./browser/branding/ >&2
              exit 1
            fi
            BASE_URL="updates.floorp.app/browser/stable/"
            UPDATE_SUFFIX="Linux/x86_64/"
          fi

          if [ -f "$UPDATE_UTILS" ]; then
            sed -i "s|REPLACE_THIS_NORA_UPDATE_HOST_TARGET_PLACEHOLDER|${BASE_URL}${UPDATE_SUFFIX}|g" "$UPDATE_UTILS"
          fi

          ./mach configure
          if [ -d .github/patches/packaging ]; then
            git apply --ignore-space-change --ignore-whitespace .github/patches/packaging/*.patch || true
          fi

      - name: Download Mozilla Linux artifact
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_artifact_workflow_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/downloads ~/artifacts
          ARTIFACT_NAME="floorp-linux-x86_64-moz-artifact"
          RELEASE_NAME="floorp-linux-x86_64-moz-artifact.tar.xz"

          if [ -n "$RUNTIME_RUN_ID" ]; then
            echo "Downloading artifact from ${RUNTIME_REPO} run $RUNTIME_RUN_ID"
            gh run download "$RUNTIME_RUN_ID" \
              --repo "$RUNTIME_REPO" \
              --name "$ARTIFACT_NAME" \
              --dir ~/downloads
            cp -r ~/downloads/* ~/artifacts/
          else
            echo "Downloading latest release artifact from ${RUNTIME_REPO}: $RELEASE_NAME"
            curl -fL \
              "https://github.com/${RUNTIME_REPO}/releases/latest/download/${RELEASE_NAME}" \
              -o "$HOME/artifacts/${RELEASE_NAME}"
          fi
          ls -la ~/artifacts

      - name: Build Noraneko (before-mach)
        run: |
          set -euo pipefail
          DENO_PATH="$(which deno)"
          REAL_DENO_PATH=""
          for possible_path in \
            /opt/hostedtoolcache/deno/*/x64/bin/deno \
            /opt/hostedtoolcache/deno/*/x64/deno \
            /home/runner/.deno/bin/deno \
            "$DENO_PATH"; do
            for path in $possible_path; do
              if [ -f "$path" ] && [ -x "$path" ]; then
                REAL_DENO_PATH="$path"
                break 2
              fi
            done
          done
          if [ -z "$REAL_DENO_PATH" ]; then
            echo "Error: Could not find deno binary" >&2
            exit 1
          fi
          export DENO_EXECUTABLE_PATH="$REAL_DENO_PATH"
          cd ./noraneko
          NODE_ENV=production deno task feles-build build --phase before-mach
          cd ..

      - name: Mach build (artifact)
        run: |
          set -euo pipefail
          ./mach configure
          ARTIFACT="$(find ~/artifacts -maxdepth 1 -type f \( \
            -name 'floorp-linux-x86_64-moz-artifact*.tar.xz' -o \
            -name 'noraneko-linux-x86_64-moz-artifact*.tar.xz' -o \
            -name '*linux*x86_64*moz-artifact*.tar.xz' \
          \) | head -n 1)"
          if [ -z "$ARTIFACT" ]; then
            echo "Linux x86_64 moz-artifact not found in ~/artifacts" >&2
            ls -la ~/artifacts >&2
            exit 1
          fi
          echo "Using MOZ_ARTIFACT_FILE=$ARTIFACT"
          MOZ_ARTIFACT_FILE="$ARTIFACT" ./mach build

      - name: Inject Noraneko (after-mach)
        run: |
          set -euo pipefail
          DIST_ROOT="$GITHUB_WORKSPACE/obj-artifact-build-output/dist"
          BUILDID2_SRC="$GITHUB_WORKSPACE/noraneko/_dist/buildid2"
          PATCH_TARGET="$DIST_ROOT/bin"

          copy_buildid2() {
            local dest_root="$1"
            if [ ! -f "$BUILDID2_SRC" ] || [ ! -d "$dest_root" ]; then
              return 0
            fi
            mkdir -p "$dest_root/browser"
            cp "$BUILDID2_SRC" "$dest_root/browser/buildid2"
          }

          cd ./noraneko
          deno task feles-build build --phase after-mach

          rsync -aL "$PATCH_TARGET/" "$DIST_ROOT/tmp__bin"
          rm -rf "$PATCH_TARGET"
          mv "$DIST_ROOT/tmp__bin" "$PATCH_TARGET"

          if [ -d ./tools/patches ]; then
            git apply --reject ./tools/patches/*.patch --directory "$PATCH_TARGET" --unsafe-paths --check --apply
          fi
          copy_buildid2 "$PATCH_TARGET"
          for candidate in "$DIST_ROOT/floorp" "$DIST_ROOT/noraneko"; do
            copy_buildid2 "$candidate"
          done
          cd ..

      - name: Apply Firefox preferences override
        run: |
          set -euo pipefail
          cd ./noraneko
          CANDIDATES=(
            "../obj-artifact-build-output/dist/bin/browser/defaults/preferences/firefox.js"
            "../obj-artifact-build-output/dist/noraneko/browser/defaults/preferences/firefox.js"
            "../obj-artifact-build-output/dist/floorp/browser/defaults/preferences/firefox.js"
          )
          FIREFOX_JS_PATH=""
          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "$candidate" ]; then
              FIREFOX_JS_PATH="$candidate"
              break
            fi
          done
          if [ -n "$FIREFOX_JS_PATH" ]; then
            ./static/gecko/pref/override.sh "$FIREFOX_JS_PATH"
          else
            echo "Warning: firefox.js not found"
          fi
          cd ..

      - name: Package (tar.xz)
        run: |
          set -euo pipefail
          for target in \
            "./obj-artifact-build-output/dist/bin/updater" \
            "./obj-artifact-build-output/dist/floorp/updater" \
            "./obj-artifact-build-output/dist/noraneko/updater"; do
            if [ -f "$target" ]; then
              patchelf --add-rpath '$ORIGIN' "$target" || true
            fi
          done

          PACKAGER_MK="./toolkit/mozapps/installer/packager.mk"
          if [ -f "$PACKAGER_MK" ]; then
            sed -i 's/--error-if-empty -C/-C/g' "$PACKAGER_MK"
          fi

          ./mach package

      - name: Build AppImage
        run: |
          set -euo pipefail
          chmod +x ./noraneko/.github/scripts/make-appimage.sh

          INPUT_ARCHIVE="$(echo obj-*/dist/floorp*tar.xz)"
          if [ ! -f "$INPUT_ARCHIVE" ]; then
            INPUT_ARCHIVE="$(find obj-artifact-build-output/dist -maxdepth 1 -type f -name '*.tar.xz' | head -n 1)"
          fi
          if [ -z "$INPUT_ARCHIVE" ] || [ ! -f "$INPUT_ARCHIVE" ]; then
            echo "Packaged tar.xz not found" >&2
            ls -la obj-artifact-build-output/dist/ >&2
            exit 1
          fi

          VERSION_DISPLAY="$(tr -d '\r\n' < ./noraneko/static/gecko/config/version_display.txt || true)"
          export FLOORP_VERSION="${VERSION_DISPLAY:-dev}"

          mkdir -p "$HOME/appimage-dist"
          ./noraneko/.github/scripts/make-appimage.sh "$INPUT_ARCHIVE" "$HOME/appimage-dist"
          ls -lah "$HOME/appimage-dist"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floorp-linux-x86_64-AppImage
          path: ~/appimage-dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
