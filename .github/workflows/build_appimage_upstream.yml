          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload capricorn
        uses: actions/upload-artifact@v4
        with:
          name: capricorn
          path: dist/capricorn/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload aquarius
        uses: actions/upload-artifact@v4
        with:
          name: aquarius
          path: dist/aquarius/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload pisces
        uses: actions/upload-artifact@v4
