#
# Quick path: download official Mozilla Firefox ONCE, brand N constellation AppImages.
# Wayland app_id stays "firefox". Prefer build_from_runtime.yml for compileId app_id.

name: Build AppImage (upstream Firefox, quick)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget python3 squashfs-tools desktop-file-utils unzip zip

      - name: Build N AppImages
        run: |
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/make-appimage.sh "$GITHUB_WORKSPACE/dist"
          find "$GITHUB_WORKSPACE/dist" -type f | sort

      - name: Upload aries
        uses: actions/upload-artifact@v4
        with:
          name: aries
          path: dist/aries/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload taurus
        uses: actions/upload-artifact@v4
        with:
          name: taurus
          path: dist/taurus/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload gemini
        uses: actions/upload-artifact@v4
        with:
          name: gemini
          path: dist/gemini/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload cancer
        uses: actions/upload-artifact@v4
        with:
          name: cancer
          path: dist/cancer/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload leo
        uses: actions/upload-artifact@v4
        with:
          name: leo
          path: dist/leo/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload virgo
        uses: actions/upload-artifact@v4
        with:
          name: virgo
          path: dist/virgo/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload libra
        uses: actions/upload-artifact@v4
        with:
          name: libra
          path: dist/libra/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload scorpio
        uses: actions/upload-artifact@v4
        with:
          name: scorpio
          path: dist/scorpio/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload sagittarius
