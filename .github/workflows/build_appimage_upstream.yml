# SPDX-License-Identifier: MPL-2.0
#
# Quick path: download official Mozilla Firefox tarball and wrap as AppImage.
# Wayland app_id stays "firefox" — GNOME panel will still say Mozilla Firefox
# unless you run scripts/install-desktop.sh. Prefer build_from_runtime.yml
# for real MOZ_APP_NAME / Floorp-style identity.

name: Build AppImage (upstream Firefox, quick)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget python3 squashfs-tools desktop-file-utils unzip zip

      - name: Build AppImage
        run: |
          chmod +x ./scripts/make-appimage.sh
          ./scripts/make-appimage.sh "$HOME/dist"
          ls -lah "$HOME/dist"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-AppImage-upstream
          path: ~/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
